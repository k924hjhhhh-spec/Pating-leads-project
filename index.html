<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painting Leads | Get a Painting Estimate</title>
<style>
:root{--ink:#202433;--muted:#667085;--brand:#5b6fe8;--bg:#f5f6f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}.card{background:#fff;padding:28px;border-radius:22px;box-shadow:0 12px 40px #20243318}
h1{margin:0 0 8px;font-size:32px}h2{font-size:20px;margin:26px 0 12px}.intro{color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;font-weight:700}label.full{grid-column:1/-1}
input,select,textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:90px;resize:vertical}button,a{display:inline-block;border:0;border-radius:10px;padding:13px 18px;font-weight:700;text-decoration:none}
button{background:var(--brand);color:#fff;cursor:pointer}.secondary{background:#eef0ff;color:var(--brand);margin-left:8px}
small{color:var(--muted);font-weight:400}.notice{display:none;margin-top:16px;padding:13px;border-radius:10px;background:#ecfdf3;color:#067647}
@media(max-width:600px){.grid{grid-template-columns:1fr}label.full{grid-column:auto}.secondary{margin:10px 0 0}}
</style>
</head>
<body><main>
<div class="card">
<h1>Get your painting project started</h1>
<p class="intro">Tell us about your project in Broward or Palm Beach. This request is for a preliminary review, not a final quote.</p>
<form id="lead-form">
<h2>Contact</h2><div class="grid">
<label>Name<input name="name" required autocomplete="name"></label>
<label>Phone or email<input name="contact" required></label>
<label>City or ZIP<input name="location" required></label>
<label>Timeline<select name="timeline" required><option value="">Choose…</option><option>As soon as possible</option><option>Within 30 days</option><option>1–3 months</option><option>Just researching</option></select></label>
</div>
<h2>Project</h2><div class="grid">
<label>Service type<select name="service_type" required><option value="">Choose…</option><option>Interior painting</option><option>Exterior painting</option><option>Cabinets</option><option>Specialty finish</option><option>Other</option></select></label>
<label>Project area<select name="area_type" required><option value="">Choose…</option><option>Residential</option><option>Commercial</option></select></label>
<label>Rooms or approximate square footage<input name="size" placeholder="Example: 3 rooms or 1,500 sq ft" required></label>
<label>Surface condition<select name="condition" required><option value="">Choose…</option><option>Good</option><option>Needs minor preparation</option><option>Needs repairs</option><option>Not sure</option></select></label>
<label class="full">Describe the work<textarea name="scope" required placeholder="What would you like painted or repaired?"></textarea></label>
<label class="full">Photos or video available?<select name="media" required><option value="">Choose…</option><option>Yes, I can provide them</option><option>Not yet</option></select></label>
</div>
<p><label><span><input type="checkbox" name="consent" required> I agree to be contacted about this painting request. <small>We do not provide a final price through this form.</small></span></label></p>
<button type="submit">Submit project request</button><a class="secondary" href="/ley_cozyla_dashboard.html">Open Ley Command Center</a>
<div id="notice" class="notice" role="status">Thank you. Your request is ready for review.</div>
</form></div></main>
<script>
document.getElementById("lead-form").addEventListener("submit",function(e){
 e.preventDefault();
 const data=Object.fromEntries(new FormData(this).entries());
 data.consent=Boolean(data.consent); data.created_at=new Date().toISOString();
 console.log("TEST MODE lead draft",data);
 document.getElementById("notice").style.display="block";
 this.reset();
});
</script>
</body></html>
